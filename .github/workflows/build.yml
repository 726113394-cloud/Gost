name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # 语言文件必须六个语种键集完全一致、且代码引用的 key 都已定义
      - name: Validate language files
        run: python3 tools/check_lang.py

      - name: Build
        run: gradle build --console=plain --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Gost-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # 打 tag（v2.4.0 这类）时自动建 Release 并附上 jar
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
